# Shared configuration file for all EarthScope repositories that feed into docs.earthscope.org

version: 1
project:
  open_access: true
  license:
    content: CC-BY-4.0
    code: Apache-2.0

site:
  template: book-theme
  options:
    folders: true
    favicon: https://www.earthscope.org/app/uploads/2022/12/cropped-favicon-32x32.png
    logo: https://www.earthscope.org/app/uploads/2025/11/NSFNGF-Logo-RGB-Color.svg
    logo_dark: https://www.earthscope.org/app/uploads/2025/11/NSFNGF-Logo-RGB-White.svg
    logo_url: https://www.earthscope.org
    internal_domains: docs.earthscope.org
    hide_search: true
  parts:
    # Points at repos's own `main` branch, not a local path, so this
    # resolves the same way for every project extending this file. See
    # "Local dev on the search widget" in README.md before editing
    # es_config/search-widget.mjs — this line will NOT pick up local changes.
    navbar_end: https://raw.githubusercontent.com/EarthScope/docs.earthscope.org/main/es_config/navbar_end_external.md
    # for local dev of this repo, comment the line above and uncomment the line below
    # navbar_end: es_config/navbar_end.md


  nav:
    - title: Docs Home
      url: https://docs.earthscope.org
    - title: Services
      children:
        - title: SeedLink
          url: /service/seedlink
        - title: NTrip
          url: https://www.earthscope.org/data/gnss-realtime/
        - title: API
          url: /api
        - title: Web Services
          url: https://service.earthscope.org/
        - title: GeoLab JupyterHub
          url: /service/geolab
    - title: Software
      children:
        - title: CLI
          url: /cli
        - title: SDK
          url: /sdk
    - title: GeoLab
      url: /geolab
