# Shared top-level ToC. A site that extends this must not define project.toc
# (MyST replaces it, not merges), and must have an index.md.
# `file:` entries resolve against the repo doing the build; where the file is
# missing MyST logs an error-level warning and omits the entry.
#
# A file entry can't also carry a url, so pages that live in docs.earthscope.org
# are listed twice: a hidden `file:` entry so this repo builds the page, and a
# visible `url:` entry that every site shows as the sidebar link.
version: 1
project:
  toc:
    - file: index.md
    - file: user_account.md
      hidden: true
    - title: User Account
      url: https://docs.earthscope.org/user-account
    - title: User Limits
      url: https://docs.earthscope.org/user-limits
    - title: Open Data on AWS
      url: https://docs.earthscope.org/sponsored-open-data
